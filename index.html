<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#082a49" />
    <title>COMLURB | Rock in Rio 2026</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: #ffffff;
        background:
          linear-gradient(rgba(3, 24, 43, 0.42), rgba(3, 24, 43, 0.58)),
          url("background.png") center / cover no-repeat fixed;
      }

      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 40px;
        text-align: center;
        font-size: clamp(2rem, 5vw, 4rem);
        line-height: 1.1;
        text-shadow: 0 3px 18px rgba(0, 0, 0, 0.75);
      }

      .atalhos {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px;
      }

      .atalho {
        min-height: 112px;
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 20px;
        color: #09233b;
        text-decoration: none;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.35;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 16px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
      }

      .atalho:hover,
      .atalho:focus-visible {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.3);
      }

      .atalho:focus-visible {
        outline: 3px solid #ff7a26;
        outline-offset: 3px;
      }

      .icone {
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        color: #ffffff;
        background: #ef6c22;
        border-radius: 13px;
      }

      .icone svg {
        width: 27px;
        height: 27px;
        fill: currentColor;
      }

      @media (max-width: 560px) {
        main {
          justify-content: flex-start;
          padding: 56px 18px 30px;
        }

        h1 {
          margin-bottom: 28px;
        }

        .atalhos {
          grid-template-columns: 1fr;
        }

        .atalho {
          min-height: 88px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>COMLURB | Rock in Rio 2026</h1>

      <nav class="atalhos" aria-label="Atalhos da auditoria">
        <a class="atalho" href="https://drive.google.com/drive/folders/1PO1y5kTklmnxdc9P_c-PkjLN7LiWQ7yL" target="_blank" rel="noopener noreferrer">
          <span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6z"/></svg></span>
          <span>TERCEIRIZADA</span>
        </a>

        <a class="atalho" href="https://drive.google.com/drive/folders/109V69u33y6PW8Au5K1J9Suwz6JF1sD8f" target="_blank" rel="noopener noreferrer">
          <span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6z"/></svg></span>
          <span>FOTOS MDS</span>
        </a>

        <a class="atalho" href="https://docs.google.com/spreadsheets/d/1CEf5xdoN-RgVK419nbOAhdf7pUSpqoLJF2T4I9-fIfA/edit?usp=drivesdk" target="_blank" rel="noopener noreferrer">
          <span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 2h10l4 4v16H5V2zm9 1.5V7h3.5L14 3.5zM8 10v2h8v-2H8zm0 4v2h8v-2H8zm0 4v2h8v-2H8z"/></svg></span>
          <span>R54 – Relatório de Dados dos Funcionários</span>
        </a>

        <a class="atalho" href="https://docs.google.com/spreadsheets/d/1KMOkSo1UL1EULpX1IrqOFQioQs4YiBVepz6gq4_hvsM/edit?usp=drivesdk" target="_blank" rel="noopener noreferrer">
          <span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 2h10l4 4v16H5V2zm9 1.5V7h3.5L14 3.5zM8 10v2h8v-2H8zm0 4v2h8v-2H8zm0 4v2h8v-2H8z"/></svg></span>
          <span>eSocial – Empregados Escalados</span>
        </a>

        <a class="atalho" href="https://docs.google.com/spreadsheets/d/1Ygz3bzYhiw-_7pSzlrzouPMjPHExXdpxlcFiURoVsns/edit?usp=drivesdk" target="_blank" rel="noopener noreferrer">
          <span class="icone" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 2h10l4 4v16H5V2zm9 1.5V7h3.5L14 3.5zM8 10v2h8v-2H8zm0 4v2h8v-2H8zm0 4v2h8v-2H8z"/></svg></span>
          <span>Escala – Planejamento Rock in Rio 2026</span>
        </a>
      </nav>
    </main>
  </body>
</html>
